<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><title>Spatial AR Bunny</title><style>body{margin:0;overflow:hidden;background:#101719;color:white;font:14px system-ui}#ui{position:fixed;inset:0;pointer-events:none;z-index:4}#top{padding:18px;background:linear-gradient(#000b,transparent)}#msg{font-size:13px;max-width:360px;margin-top:6px}#buttons{position:absolute;bottom:22px;left:0;right:0;display:flex;justify-content:center;gap:10px;pointer-events:auto}button{border:0;border-radius:24px;padding:14px 20px;font-weight:700;background:#fff;color:#18201d}button:disabled{opacity:.5}#hint{position:absolute;top:45%;width:100%;text-align:center;color:#fffc}canvas{display:block}</style></head><body><div id="ui"><div id="top"><b>🐰 Spatial AR Bunny v0.5</b><div id="msg">Checking Android WebXR support…</div></div><div id="hint">Scan a well-lit floor, then tap to place the rabbit</div><div id="buttons"><button id="start" disabled>Start Real AR</button><button id="hop" hidden>Hop</button><button id="reset" hidden>Reposition</button></div></div><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js';
const msg=document.getElementById('msg'),start=document.getElementById('start'),hop=document.getElementById('hop'),reset=document.getElementById('reset'),hint=document.getElementById('hint');
const scene=new THREE.Scene();const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.01,30);const renderer=new THREE.WebGLRenderer({alpha:true,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.xr.enabled=true;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.shadowMap.enabled=true;document.body.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x777c82,2.3));const light=new THREE.DirectionalLight(0xffffff,2);light.position.set(-2,5,3);scene.add(light);
const mat=(c,r=0.9)=>new THREE.MeshStandardMaterial({color:c,roughness:r});const fur=mat(0xe9e5db),pink=mat(0xc8898c),black=mat(0x131315,.14),white=mat(0xffffff);const bunny=new THREE.Group();const part=(parent,geo,m,x,y,z,sx=1,sy=1,sz=1)=>{const mesh=new THREE.Mesh(geo,m);mesh.position.set(x,y,z);mesh.scale.set(sx,sy,sz);parent.add(mesh);return mesh};const sphere=new THREE.SphereGeometry(1,24,16);part(bunny,sphere,fur,0,.19,0,.19,.20,.30);part(bunny,sphere,fur,0,.31,-.23,.16,.16,.16);for(const x of [-1,1]){part(bunny,sphere,fur,x*.093,.48,-.25,.065,.19,.045);part(bunny,sphere,pink,x*.093,.49,-.284,.035,.145,.018);part(bunny,sphere,black,x*.127,.34,-.332,.026,.029,.019);part(bunny,sphere,fur,x*.13,.085,.18,.10,.075,.13);part(bunny,sphere,fur,x*.115,.11,-.20,.08,.07,.11)}part(bunny,sphere,pink,0,.277,-.388,.023,.017,.018);part(bunny,sphere,white,0,.19,.31,.095,.095,.095);bunny.visible=false;scene.add(bunny);
const reticle=new THREE.Mesh(new THREE.RingGeometry(.09,.11,32).rotateX(-Math.PI/2),new THREE.MeshBasicMaterial({color:0x64ffb4,side:THREE.DoubleSide}));reticle.matrixAutoUpdate=false;reticle.visible=false;scene.add(reticle);let session=null,hitSource=null,viewerSpace=null,placed=false,hopTime=0,baseY=0;
if(!window.isSecureContext){msg.textContent='HTTPS required. Deploy as a Render Static Site and open the https:// URL.';}else if(!navigator.xr){msg.textContent='WebXR unavailable in this browser. Use Chrome Android + Google Play Services for AR.';}else{try{const ok=await navigator.xr.isSessionSupported('immersive-ar');start.disabled=!ok;msg.textContent=ok?'Ready for real world-anchored AR.':'Immersive AR unavailable on this device/browser. Camera overlay disabled.';}catch(e){msg.textContent='WebXR check failed: '+e.message;}}
start.onclick=async()=>{
 start.disabled=true;msg.textContent='Trying compatible AR session…';
 const configs=[
  {requiredFeatures:['hit-test'],optionalFeatures:['local-floor','dom-overlay'],domOverlay:{root:document.getElementById('ui')}},
  {requiredFeatures:['hit-test'],optionalFeatures:['local-floor']},
  {requiredFeatures:['hit-test']}
 ];
 let errors=[];
 for(const config of configs){try{session=await navigator.xr.requestSession('immersive-ar',config);break;}catch(e){errors.push(e.name+': '+e.message);}}
 if(!session){msg.textContent='Real AR could not start: '+errors.join(' | ')+'. Check Chrome, Google Play Services for AR, and device compatibility.';start.disabled=false;return;}
 try{
  await renderer.xr.setSession(session);
  viewerSpace=await session.requestReferenceSpace('viewer');
  hitSource=await session.requestHitTestSource({space:viewerSpace});
  session.addEventListener('select',()=>place());
  msg.textContent='Scan floor. Tap screen to place rabbit. Real spatial AR active; depth occlusion not enabled.';
  start.hidden=true;hop.hidden=false;reset.hidden=false;
  session.addEventListener('end',()=>{session=null;hitSource=null;placed=false;bunny.visible=false;reticle.visible=false;start.hidden=false;start.disabled=false;hop.hidden=true;reset.hidden=true;hint.hidden=false;});
 }catch(e){msg.textContent='AR initialization failed: '+e.name+' — '+e.message;await session.end();start.disabled=false;}
};
const place=()=>{if(!session||!reticle.visible)return;bunny.position.setFromMatrixPosition(reticle.matrix);baseY=bunny.position.y;bunny.visible=true;placed=true;hint.hidden=true;msg.textContent='Rabbit anchored to real-world floor. Walk around it to test parallax.'};renderer.domElement.addEventListener('click',place);document.getElementById('ui').addEventListener('click',e=>{if(e.target.id==='hint')place()});hop.onclick=()=>{if(placed)hopTime=performance.now()};reset.onclick=()=>{placed=false;bunny.visible=false;hint.hidden=false;msg.textContent='Scan another floor location and tap to reposition.'};
renderer.setAnimationLoop((t,frame)=>{if(frame&&hitSource){const ref=renderer.xr.getReferenceSpace();const hits=frame.getHitTestResults(hitSource);reticle.visible=!placed&&hits.length>0;if(reticle.visible){const pose=hits[0].getPose(ref);reticle.matrix.fromArray(pose.transform.matrix)}}if(placed){bunny.position.y=baseY+(hopTime?Math.max(0,Math.sin((t-hopTime)/650*Math.PI))*.18:0);if(hopTime&&t-hopTime>650)hopTime=0;bunny.rotation.y=Math.sin(t*.0004)*.16}renderer.render(scene,camera)});
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
