<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Bunny Marker AR v0.7</title><style>body{margin:0;background:#111;color:white;font:14px system-ui}video,canvas{position:fixed;inset:0;width:100%;height:100%;object-fit:cover}#hud{position:fixed;top:12px;left:12px;right:12px;background:#0009;padding:12px;border-radius:12px}button{font:inherit;padding:12px;border:0;border-radius:20px}#controls{position:fixed;bottom:22px;left:12px;right:12px;display:flex;gap:8px}#controls button{flex:1}#status{margin-top:6px}</style></head><body><video id="video" autoplay muted playsinline></video><canvas id="out"></canvas><div id="hud"><b>🐰 Bunny Marker AR v0.7 — X kuning 10 cm</b><div id="status">Tekan Start Camera, lalu tap tepat di tengah X kuning.</div></div><div id="controls"><button id="start">Start Camera</button><button id="flip">Switch Camera</button></div><script src="https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.min.js"></script><script>
const video=document.querySelector('#video'),out=document.querySelector('#out'),ctx=out.getContext('2d'),status=document.querySelector('#status');
let stream,front=false,locked=null,smoothed=null,lastSeen=0;const sample=document.createElement('canvas'),sc=sample.getContext('2d',{willReadFrequently:true});sample.width=320;sample.height=240;
const renderer=new THREE.WebGLRenderer({alpha:true,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.domElement.style.cssText='position:fixed;inset:0;width:100%;height:100%;pointer-events:none';document.body.insertBefore(renderer.domElement,document.querySelector('#hud'));
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(55,1,.01,100);camera.position.set(0,0,0);scene.add(new THREE.HemisphereLight(0xffffff,0x888888,2));const light=new THREE.DirectionalLight(0xffffff,2);light.position.set(-1,3,2);scene.add(light);
const bunny=new THREE.Group();scene.add(bunny);const white=new THREE.MeshStandardMaterial({color:0xf6f3ed,roughness:.95}),pink=new THREE.MeshStandardMaterial({color:0xd997a0}),black=new THREE.MeshStandardMaterial({color:0x15100e,roughness:.2});function oval(parent,mat,x,y,z,sx,sy,sz){const m=new THREE.Mesh(new THREE.SphereGeometry(1,24,16),mat);m.position.set(x,y,z);m.scale.set(sx,sy,sz);parent.add(m);return m}oval(bunny,white,0,.13,-.045,.14,.12,.19);oval(bunny,white,0,.23,.105,.12,.115,.115);for(let s of [-1,1]){oval(bunny,white,s*.068,.39,.07,.038,.14,.03);oval(bunny,pink,s*.068,.4,.095,.024,.107,.01);oval(bunny,black,s*.065,.245,.204,.014,.018,.009);oval(bunny,white,s*.11,.055,.11,.055,.045,.065)}oval(bunny,pink,0,.198,.218,.018,.012,.009);oval(bunny,white,0,.13,-.23,.05,.05,.05);bunny.visible=false;
function size(){const w=innerWidth,h=innerHeight;out.width=w*devicePixelRatio;out.height=h*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix()}addEventListener('resize',size);size();
async function start(){try{stream?.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:front?'user':'environment',width:{ideal:1280},height:{ideal:720}}});video.srcObject=stream;await video.play();locked=null;smoothed=null;status.textContent='Arahkan X ke kamera lalu TAP TEPAT di tengah X untuk mengunci marker.'}catch(e){status.textContent='Camera error: '+e.name+' '+e.message}}document.querySelector('#start').onclick=start;document.querySelector('#flip').onclick=()=>{front=!front;start()};
// The video uses object-fit:cover. Convert between video pixels, sample pixels and screen pixels exactly.
function mapping(){const vw=video.videoWidth||1280,vh=video.videoHeight||720,w=innerWidth,h=innerHeight,k=Math.max(w/vw,h/vh),ox=(w-vw*k)/2,oy=(h-vh*k)/2;return {toSample:(x,y)=>({x:(x-ox)/k/vw*320,y:(y-oy)/k/vh*240}),toScreen:(x,y)=>({x:ox+x/320*vw*k,y:oy+y/240*vh*k}),pxPerSampleX:vw*k/320,pxPerSampleY:vh*k/240}};
out.addEventListener('pointerdown',e=>{if(video.readyState<2)return;const p=mapping().toSample(e.clientX,e.clientY);locked={x:p.x,y:p.y};smoothed=null;status.textContent='Marker dikunci. Tracking X kuning di sekitar titik yang dipilih…'});
// Extract yellow in HSV-like RGB constraints, but only near the tapped target; avoid other yellow objects.
function yellow(r,g,b){const max=Math.max(r,g,b),min=Math.min(r,g,b),d=max-min;if(d<24||max<70)return false;const sat=d/max;if(sat<.23)return false;return r>b*1.35&&g>b*1.3&&g>r*.55&&r>g*.75}
function locate(data,seed){const radius=65;let count=0,sx=0,sy=0,minx=320,maxx=0,miny=240,maxy=0;const cx=seed.x,cy=seed.y;for(let y=Math.max(0,Math.floor(cy-radius));y<Math.min(240,Math.ceil(cy+radius));y+=2)for(let x=Math.max(0,Math.floor(cx-radius));x<Math.min(320,Math.ceil(cx+radius));x+=2){const i=(y*320+x)*4;if(yellow(data[i],data[i+1],data[i+2])){count++;sx+=x;sy+=y;minx=Math.min(minx,x);maxx=Math.max(maxx,x);miny=Math.min(miny,y);maxy=Math.max(maxy,y)}}if(count<16||maxx-minx<12||maxy-miny<12)return null;const x=sx/count,y=sy/count,span=Math.max(maxx-minx,maxy-miny);if(Math.hypot(x-cx,y-cy)>48)return null;return {x,y,span,count}}
function tick(t){requestAnimationFrame(t);ctx.clearRect(0,0,innerWidth,innerHeight);if(video.readyState>=2){sc.drawImage(video,0,0,320,240);const data=sc.getImageData(0,0,320,240).data;if(locked){const found=locate(data,locked);if(found){locked={x:found.x,y:found.y};smoothed=smoothed?{x:smoothed.x*.65+found.x*.35,y:smoothed.y*.65+found.y*.35,span:smoothed.span*.7+found.span*.3}:found;lastSeen=t;}else if(t-lastSeen>450){smoothed=null;status.textContent='X hilang. Tap lagi tepat di pusat X, dengan semua ujung X terlihat.'}
if(smoothed){const map=mapping(),p=map.toScreen(smoothed.x,smoothed.y);ctx.strokeStyle='#4cff7d';ctx.lineWidth=3;ctx.beginPath();ctx.arc(p.x,p.y,15,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#fff';ctx.fillText('X locked',p.x+20,p.y-8);
// Use screen-to-world perspective mapping: 10cm marker, bunny body ~25cm. Bunny base sits on marker.
const apparentMarkerPx=smoothed.span*Math.max(map.pxPerSampleX,map.pxPerSampleY);const h=innerHeight,w=innerWidth;const focal=h/(2*Math.tan(camera.fov*Math.PI/360));const depth=Math.max(.25,Math.min(3, .10*focal/Math.max(10,apparentMarkerPx)));const viewHeight=2*depth*Math.tan(camera.fov*Math.PI/360);bunny.position.set((p.x/w-.5)*viewHeight*camera.aspect, (.5-p.y/h)*viewHeight, -depth);bunny.scale.setScalar(.55);bunny.rotation.set(0,0,0);bunny.visible=true;status.textContent='X terkunci ('+found?.count+' sampel). Kelinci duduk di titik X. Tap ulang jika bergeser.';
}else bunny.visible=false;}else{bunny.visible=false;status.textContent='Tap di titik tengah X kuning untuk kalibrasi tracking.'}}else bunny.visible=false;renderer.render(scene,camera)}requestAnimationFrame(tick);
</script></body></html>
