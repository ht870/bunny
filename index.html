<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Bunny Marker v0.8</title><style>*{box-sizing:border-box}body{margin:0;background:#101718;color:#fff;font:14px system-ui}video,canvas{position:fixed;inset:0;width:100%;height:100%;object-fit:cover}#hud{position:fixed;top:12px;left:12px;right:12px;background:#000b;padding:12px;border-radius:12px;pointer-events:none}#controls{position:fixed;bottom:16px;left:12px;right:12px;display:flex;gap:8px;flex-wrap:wrap}button{border:0;border-radius:20px;padding:12px;background:white;color:#111;flex:1;min-width:100px;font:inherit}#status{margin-top:6px;white-space:pre-line}</style></head><body><video id="video" autoplay muted playsinline></video><canvas id="overlay"></canvas><div id="hud"><b>🐰 Bunny Marker v0.8 — Detection Debug</b><div id="status">Start Camera. Arahkan X kuning ke kamera.</div></div><div id="controls"><button id="start">Start Camera</button><button id="flip">Switch Camera</button><button id="test">Show Bunny</button></div><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
const video=document.getElementById('video'),overlay=document.getElementById('overlay'),ctx=overlay.getContext('2d'),status=document.getElementById('status');
const sample=document.createElement('canvas');sample.width=320;sample.height=240;const sc=sample.getContext('2d',{willReadFrequently:true});let stream,front=false,locked=null,smooth=null,debug=false,frame=0;
const renderer=new THREE.WebGLRenderer({alpha:true,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.domElement.style.cssText='position:fixed;inset:0;width:100%;height:100%;pointer-events:none';document.body.insertBefore(renderer.domElement,overlay);
const scene=new THREE.Scene(),camera=new THREE.OrthographicCamera(0,innerWidth,innerHeight,0,.1,100);camera.position.z=10;scene.add(new THREE.HemisphereLight(0xffffff,0x777777,2));const light=new THREE.DirectionalLight(0xffffff,2);light.position.set(-1,3,5);scene.add(light);
const bunny=new THREE.Group();scene.add(bunny);const white=new THREE.MeshStandardMaterial({color:0xf5f2e9,roughness:.85}),pink=new THREE.MeshStandardMaterial({color:0xd88c98}),black=new THREE.MeshStandardMaterial({color:0x18120f,roughness:.15});function oval(mat,x,y,z,sx,sy,sz){const m=new THREE.Mesh(new THREE.SphereGeometry(1,20,14),mat);m.position.set(x,y,z);m.scale.set(sx,sy,sz);bunny.add(m)}oval(white,0,15,-4,28,24,35);oval(white,0,44,13,25,25,24);for(const s of [-1,1]){oval(white,s*14,79,8,8,30,7);oval(pink,s*14,80,14,5,23,2);oval(black,s*14,48,35,4,5,3);oval(white,s*22,1,17,12,9,15)}oval(pink,0,36,38,5,3,3);bunny.visible=false;
function resize(){const w=innerWidth,h=innerHeight,d=devicePixelRatio||1;overlay.width=w*d;overlay.height=h*d;ctx.setTransform(d,0,0,d,0,0);renderer.setSize(w,h);camera.left=0;camera.right=w;camera.top=h;camera.bottom=0;camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();
function mapping(){const vw=video.videoWidth||1280,vh=video.videoHeight||720,w=innerWidth,h=innerHeight,k=Math.max(w/vw,h/vh),ox=(w-vw*k)/2,oy=(h-vh*k)/2;return {toSample:(x,y)=>({x:(x-ox)/k/vw*320,y:(y-oy)/k/vh*240}),toScreen:(x,y)=>({x:ox+x/320*vw*k,y:oy+y/240*vh*k}),scale:vw*k/320}}
async function start(){try{stream?.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:front?'user':'environment',width:{ideal:1280},height:{ideal:720}},audio:false});video.srcObject=stream;await video.play();locked=null;smooth=null;status.textContent='Kamera aktif. X akan dicari otomatis. Tap pusat X bila perlu.'}catch(e){status.textContent='Camera error: '+e.name+' '+e.message}}document.getElementById('start').onclick=start;document.getElementById('flip').onclick=()=>{front=!front;start()};document.getElementById('test').onclick=()=>{debug=!debug;document.getElementById('test').textContent=debug?'Hide Test':'Show Bunny'};overlay.addEventListener('pointerdown',e=>{const p=mapping().toSample(e.clientX,e.clientY);locked=p;smooth=null});
// Yellow against white tissue: relative color excess works better than hard saturation.
function yellow(r,g,b){return r>70&&g>70&&r>b*1.18&&g>b*1.18&&Math.min(r,g)-b>18&&Math.abs(r-g)<110}
function detect(data){const mask=new Uint8Array(320*240);let total=0;for(let y=0;y<240;y+=2)for(let x=0;x<320;x+=2){const i=(y*320+x)*4;if(yellow(data[i],data[i+1],data[i+2])){mask[y*320+x]=1;total++}}let sx=0,sy=0,n=0,minx=320,maxx=0,miny=240,maxy=0;let seed=locked; // local search, but with generous radius; no lock = entire frame
const radius=seed?95:1000;for(let y=0;y<240;y+=2)for(let x=0;x<320;x+=2){if(!mask[y*320+x]||(seed&&Math.hypot(x-seed.x,y-seed.y)>radius))continue;sx+=x;sy+=y;n++;minx=Math.min(minx,x);maxx=Math.max(maxx,x);miny=Math.min(miny,y);maxy=Math.max(maxy,y)}const found=n>=10&&maxx-minx>=8&&maxy-miny>=8?{x:sx/n,y:sy/n,n,span:Math.max(maxx-minx,maxy-miny),minx,maxx,miny,maxy}:null;return {found,total}}
function loop(){requestAnimationFrame(loop);ctx.clearRect(0,0,innerWidth,innerHeight);let f=null,total=0;if(video.readyState>=2){sc.drawImage(video,0,0,320,240);const d=sc.getImageData(0,0,320,240);({found:f,total}=detect(d.data));if(f){smooth=smooth?{x:smooth.x*.65+f.x*.35,y:smooth.y*.65+f.y*.35,span:smooth.span*.7+f.span*.3}:f;if(locked)locked={x:smooth.x,y:smooth.y};}else smooth=null;
const map=mapping();if(smooth){const p=map.toScreen(smooth.x,smooth.y);ctx.strokeStyle='#45ff6d';ctx.lineWidth=4;ctx.beginPath();ctx.arc(p.x,p.y,18,0,7);ctx.stroke();ctx.fillStyle='#45ff6d';ctx.fillText('DETECTED',p.x+24,p.y);const a=map.toScreen(f.minx,f.miny),b=map.toScreen(f.maxx,f.maxy);ctx.strokeRect(a.x,a.y,b.x-a.x,b.y-a.y);const size=Math.max(65,Math.min(170,smooth.span*map.scale*1.1));bunny.scale.setScalar(size/120);bunny.position.set(p.x,innerHeight-p.y+size*.04,0);bunny.visible=true;}else bunny.visible=false;
if(++frame%12===0)status.textContent='Kamera OK | yellow pixels: '+total+' | X: '+(f?'DETECTED':'NOT FOUND')+'\n'+(f?'Center: '+f.x.toFixed(0)+','+f.y.toFixed(0)+' | span: '+f.span.toFixed(0):'Coba dekatkan X / tambah cahaya / tap tengah X')+'\nTracking warna 2D, belum pose 3D.';
}else{bunny.visible=false}if(debug){bunny.visible=true;bunny.position.set(innerWidth/2,innerHeight*.42,0);bunny.scale.setScalar(1)}renderer.render(scene,camera)}loop();
</script></body></html>
