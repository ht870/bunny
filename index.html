<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>AR Bunny Prototype</title><style>body{margin:0;background:#10191b;color:white;font:15px system-ui;overflow:hidden}#hud{position:fixed;top:0;left:0;right:0;padding:16px;background:linear-gradient(#0009,transparent);z-index:5}#status{font-size:12px;opacity:.85}#actions{position:fixed;bottom:22px;left:0;right:0;display:flex;gap:8px;justify-content:center;z-index:5}button{background:#fff;color:#15221c;border:0;border-radius:24px;padding:13px 17px;font-weight:700}#fallback{position:fixed;top:48%;width:100%;text-align:center;pointer-events:none;color:#fffd}canvas{display:block}#cameraFeed{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:-1;background:#111}#actions{flex-wrap:wrap}#fallback{top:36%;padding:0 12px;box-sizing:border-box}</style></head><body><video id="cameraFeed" autoplay muted playsinline></video><div id="hud"><b>🐰 AR Bunny — Prototype</b><div id="status">Loading 3D scene…</div></div><div id="fallback">Tap “Start AR”, scan the floor, then tap to place your rabbit.</div><div id="actions"><button id="ar">📷 Start Camera / AR</button><button id="stop">Stop Camera</button><button id="feed">🥕 Feed</button><button id="hop">🐇 Hop</button></div><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js';
const status=document.querySelector('#status'),hint=document.querySelector('#fallback');const scene=new THREE.Scene();scene.background=new THREE.Color('#273b3c');const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.01,100);camera.position.set(0,1.3,2.8);const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.xr.enabled=true;renderer.shadowMap.enabled=true;renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.append(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x667377,2.5));const sun=new THREE.DirectionalLight(0xffffff,2.2);sun.position.set(-2,5,3);sun.castShadow=true;scene.add(sun);const floor=new THREE.Mesh(new THREE.PlaneGeometry(12,12),new THREE.MeshStandardMaterial({color:0x708d7d,roughness:1}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
const rabbit=new THREE.Group();const fur=new THREE.MeshStandardMaterial({color:0xf2eee6,roughness:.98});const inner=new THREE.MeshStandardMaterial({color:0xd8a7a3,roughness:.9});const dark=new THREE.MeshStandardMaterial({color:0x171314,roughness:.15});const nose=new THREE.MeshStandardMaterial({color:0xb7777b,roughness:.5});function ell(parent,mat,x,y,z,a,b,c){let m=new THREE.Mesh(new THREE.SphereGeometry(1,32,20),mat);m.position.set(x,y,z);m.scale.set(a,b,c);m.castShadow=true;parent.add(m);return m}ell(rabbit,fur,0,.28,-.08,.26,.25,.39);ell(rabbit,fur,0,.45,.23,.22,.22,.22);const ears=[];for(let s of [-1,1]){const ear=new THREE.Group();ear.position.set(s*.125,.58,.23);let outer=ell(ear,fur,0,.22,0,.095,.26,.055);outer.rotation.z=-s*.16;let pink=ell(ear,inner,0,.22,.047,.055,.205,.018);pink.rotation.z=-s*.16;rabbit.add(ear);ears.push(ear);ell(rabbit,dark,s*.157,.48,.392,.035,.04,.024);ell(rabbit,fur,s*.17,.16,.17,.11,.11,.15);ell(rabbit,fur,s*.18,.14,-.31,.12,.13,.14)}ell(rabbit,nose,0,.405,.445,.039,.027,.026);ell(rabbit,fur,0,.27,-.44,.12,.12,.12);rabbit.position.set(0,0,-1.4);scene.add(rabbit);
let session=null,hitSource=null,placed=false,hopUntil=0,feedUntil=0;const reticle=new THREE.Mesh(new THREE.RingGeometry(.09,.12,32).rotateX(-Math.PI/2),new THREE.MeshBasicMaterial({color:0x75f9a0,side:THREE.DoubleSide}));reticle.matrixAutoUpdate=false;reticle.visible=false;scene.add(reticle);let cameraStream=null,cameraMode=false;
async function cameraFallback(reason){
 if(!navigator.mediaDevices?.getUserMedia){status.textContent='Camera unavailable: open this page over HTTPS (not file://). '+reason;return}
 try{
  cameraStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});
  const video=document.querySelector('#cameraFeed');video.srcObject=cameraStream;await video.play();
  cameraMode=true;scene.background=null;floor.visible=false;rabbit.visible=true;rabbit.position.set(0,-.35,-1.4);
  status.textContent='Camera Mode active — 3D overlay (no floor tracking)';
  hint.textContent='Camera is live. Bunny is a 3D overlay; true floor tracking needs WebXR + ARCore.';
  document.querySelector('#ar').textContent='📷 Camera On';
 }catch(e){status.textContent='Camera failed: '+e.name+' — '+e.message+'; requires HTTPS and camera permission.'}
}
document.querySelector('#ar').onclick=async()=>{
 if(session||cameraMode)return;
 if(!window.isSecureContext){status.textContent='Camera needs HTTPS or localhost. Upload index.html to an HTTPS host.';return}
 let reason='WebXR unavailable';
 if(navigator.xr){try{
  if(!(await navigator.xr.isSessionSupported('immersive-ar')))throw Error('immersive-ar not supported');
  session=await navigator.xr.requestSession('immersive-ar',{requiredFeatures:['hit-test'],optionalFeatures:['dom-overlay','local-floor'],domOverlay:{root:document.body}});
  await renderer.xr.setSession(session);scene.background=null;floor.visible=false;rabbit.visible=false;
  const viewer=await session.requestReferenceSpace('viewer');hitSource=await session.requestHitTestSource({space:viewer});
  session.addEventListener('select',()=>{if(reticle.visible){rabbit.position.setFromMatrixPosition(reticle.matrix);rabbit.visible=true;placed=true;hint.textContent='Rabbit placed! Try Feed or Hop.'}});
  session.addEventListener('end',()=>{session=null;hitSource=null;placed=false;reticle.visible=false;floor.visible=true;scene.background=new THREE.Color('#273b3c');rabbit.visible=true;rabbit.position.set(0,0,-1.4)});
  status.textContent='Native AR active — scan floor and tap';hint.textContent='Move phone slowly over a well-lit floor';return;
 }catch(e){reason=e.message;session=null}}
 await cameraFallback(reason);
};
document.querySelector('#stop').onclick=async()=>{
 if(session){await session.end();return}
 if(cameraStream){cameraStream.getTracks().forEach(t=>t.stop());cameraStream=null}
 document.querySelector('#cameraFeed').srcObject=null;cameraMode=false;
 scene.background=new THREE.Color('#273b3c');floor.visible=true;rabbit.position.set(0,0,-1.4);
 status.textContent='Camera stopped';hint.textContent='Tap Start Camera / AR to retry';document.querySelector('#ar').textContent='📷 Start Camera / AR';
};
document.querySelector('#hop').onclick=()=>{hopUntil=performance.now()+950;status.textContent='Bunny is hopping!'};document.querySelector('#feed').onclick=()=>{feedUntil=performance.now()+2500;status.textContent='🥕 Bunny is nibbling a carrot!'};const carrot=new THREE.Group();ell(carrot,new THREE.MeshStandardMaterial({color:0xef8128}),0,0,0,.045,.11,.045);ell(carrot,new THREE.MeshStandardMaterial({color:0x4e9e48}),0,.12,0,.045,.055,.035);carrot.position.set(.26,.13,.45);rabbit.add(carrot);carrot.visible=false;
renderer.setAnimationLoop((time,frame)=>{if(session&&frame&&hitSource){const hits=frame.getHitTestResults(hitSource);if(hits.length){const ref=renderer.xr.getReferenceSpace(),pose=hits[0].getPose(ref);if(pose){reticle.visible=!placed;reticle.matrix.fromArray(pose.transform.matrix)}}else reticle.visible=false}const t=time*.001;ears[0].rotation.z=Math.sin(t*1.9)*.045;ears[1].rotation.z=-Math.sin(t*1.7)*.05;rabbit.scale.y=1+Math.sin(t*2.5)*.008;const h=Math.max(0,1-Math.abs(time-(hopUntil-475))/475);rabbit.position.y=h*.35;carrot.visible=time<feedUntil;if(carrot.visible)rabbit.rotation.x=Math.sin(t*13)*.035;else rabbit.rotation.x=0;renderer.render(scene,camera)});addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});status.textContent='Ready. Camera needs HTTPS; native AR additionally needs WebXR + ARCore.';
</script></body></html>
