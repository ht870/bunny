<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Bunny Marker AR v0.6</title><style>body{margin:0;background:#111;color:white;font:14px system-ui}video,canvas{position:fixed;inset:0;width:100%;height:100%;object-fit:cover}#hud{position:fixed;top:12px;left:12px;right:12px;background:#0009;padding:12px;border-radius:12px}button{font:inherit;padding:12px;border:0;border-radius:20px}#controls{position:fixed;bottom:22px;left:12px;right:12px;display:flex;gap:8px}#controls button{flex:1}#status{margin-top:6px}</style></head><body><video id="video" autoplay muted playsinline></video><canvas id="out"></canvas><div id="hud"><b>🐰 Bunny Marker AR v0.6 — X kuning 10 cm</b><div id="status">Tekan Start Camera. Ini eksperimen tracking X, bukan ARCore.</div></div><div id="controls"><button id="start">Start Camera</button><button id="flip">Switch Camera</button></div><script src="https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.min.js"></script><script>
const video=document.querySelector('#video'),out=document.querySelector('#out'),ctx=out.getContext('2d'),status=document.querySelector('#status');let stream,front=false;const sample=document.createElement('canvas'),sc=sample.getContext('2d',{willReadFrequently:true});sample.width=320;sample.height=240;
const renderer=new THREE.WebGLRenderer({alpha:true,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.domElement.style.cssText='position:fixed;inset:0;width:100%;height:100%;pointer-events:none';document.body.insertBefore(renderer.domElement,document.querySelector('#hud'));const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(55,1,.01,100);camera.position.set(0,.24,.65);camera.lookAt(0,.1,0);scene.add(new THREE.HemisphereLight(0xffffff,0x888888,2));let light=new THREE.DirectionalLight(0xffffff,2);light.position.set(-1,3,2);scene.add(light);const bunny=new THREE.Group();scene.add(bunny);const white=new THREE.MeshStandardMaterial({color:0xf6f3ed,roughness:.95}),pink=new THREE.MeshStandardMaterial({color:0xd997a0}),black=new THREE.MeshStandardMaterial({color:0x15100e,roughness:.2});function oval(parent,mat,x,y,z,sx,sy,sz){const m=new THREE.Mesh(new THREE.SphereGeometry(1,24,16),mat);m.position.set(x,y,z);m.scale.set(sx,sy,sz);parent.add(m);return m}oval(bunny,white,0,.13,-.045,.14,.12,.19);oval(bunny,white,0,.23,.105,.12,.115,.115);for(let s of [-1,1]){oval(bunny,white,s*.068,.39,.07,.038,.14,.03);oval(bunny,pink,s*.068,.4,.095,.024,.107,.01);oval(bunny,black,s*.065,.245,.204,.014,.018,.009);oval(bunny,white,s*.11,.055,.11,.055,.045,.065)}oval(bunny,pink,0,.198,.218,.018,.012,.009);oval(bunny,white,0,.13,-.23,.05,.05,.05);bunny.visible=false;
let pos=null,last=0;function size(){const w=innerWidth,h=innerHeight;out.width=w*devicePixelRatio;out.height=h*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix()}addEventListener('resize',size);size();
async function start(){try{stream?.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:front?'user':'environment',width:{ideal:1280},height:{ideal:720}}});video.srcObject=stream;await video.play();status.textContent='Cari X kuning. Pastikan terang dan X terlihat utuh.'}catch(e){status.textContent='Camera error: '+e.name+' '+e.message}}document.querySelector('#start').onclick=start;document.querySelector('#flip').onclick=()=>{front=!front;start()};
function tick(t){requestAnimationFrame(tick);if(video.readyState>=2){const w=innerWidth,h=innerHeight;ctx.clearRect(0,0,w,h);sc.drawImage(video,0,0,320,240);const data=sc.getImageData(0,0,320,240).data;let count=0,sumx=0,sumy=0,minx=320,maxx=0,miny=240,maxy=0;for(let y=0;y<240;y+=2)for(let x=0;x<320;x+=2){const i=(y*320+x)*4,r=data[i],g=data[i+1],b=data[i+2];if(r>85&&g>85&&b<Math.min(r,g)*.83&&Math.abs(r-g)<105&&r+b<345){count++;sumx+=x;sumy+=y;minx=Math.min(minx,x);maxx=Math.max(maxx,x);miny=Math.min(miny,y);maxy=Math.max(maxy,y)}}if(count>35&&maxx-minx>18&&maxy-miny>18){const x=sumx/count/320*w,y=sumy/count/240*h;pos=pos?{x:pos.x*.7+x*.3,y:pos.y*.7+y*.3,span:pos.span*.7+Math.max(maxx-minx,maxy-miny)*.3}:{x,y,span:Math.max(maxx-minx,maxy-miny)};last=t;ctx.strokeStyle='#4cff7d';ctx.lineWidth=3;ctx.beginPath();ctx.arc(pos.x,pos.y,22,0,Math.PI*2);ctx.stroke();ctx.fillStyle='white';ctx.fillText('X detected',pos.x+28,pos.y);status.textContent='X terdeteksi — '+count+' pixel sampel. Estimasi posisi (belum pose 6DoF).'}else if(t-last>500){pos=null;status.textContent='X tidak terdeteksi — dekatkan kamera / tambah cahaya.'}if(pos){bunny.visible=true;const nx=(pos.x/w-.5)*2,ny=(.5-pos.y/h)*2;const distance=Math.max(.28,Math.min(2,35/pos.span));const fov=camera.fov*Math.PI/180;const visibleHeight=2*distance*Math.tan(fov/2);bunny.position.set(nx*visibleHeight*camera.aspect/2,-ny*visibleHeight/2-.14,-distance+.65);bunny.rotation.y=Math.sin(t/1300)*.2;bunny.scale.setScalar(.75);bunny.position.y+=Math.sin(t/500)*.004}else bunny.visible=false;}renderer.render(scene,camera)}requestAnimationFrame(tick);
</script></body></html>
